[package]
name = "synth-core"
version = "0.1.0"
edition = "2021"
authors = ["Renick Bell <renick@gmail.com>"]
description = "Shared parameter, preset, patch diff, randomization, and command history library"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
